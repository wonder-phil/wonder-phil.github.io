<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);

        // Mars
        const marsSrc = isLocal
          ? 'http://localhost:8000/p04/IMAGES/mars-surface.avif'
          : './IMAGES/mars-surface.avif';
        document.getElementById('mars-img').setAttribute('src', marsSrc);

        document.querySelector('a-assets').addEventListener('loaded', () => {
          document.getElementById('mars').setAttribute('material', 'src: #mars-img');
        });
      });
    </script>

    <a-scene>
      <a-entity camera position="0 4 10" rotation="-25 0 0" look-controls wasd-controls="fly: true"></a-entity>

      <a-sky color="#000010"></a-sky>

      <a-assets>
        <img id="mars-img" crossorigin="anonymous">
      </a-assets>

      <!-- Sun -->
      <a-sphere position="0 2 -5" radius="2" color="#FDB813"></a-sphere>

      <!-- Orbit rings (visible paths) -->
      <a-torus position="0 2 -5" rotation="90 0 0" radius="3" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="4.3" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="5.6" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="7" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="10.5" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="13.5" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="16.5" radius-tubular="0.01" color="#555"></a-torus>
      <a-torus position="0 2 -5" rotation="90 0 0" radius="19.5" radius-tubular="0.01" color="#555"></a-torus>

      <!-- Mercury: no moons -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2400">
        <a-sphere position="3 0 0" radius="0.1" color="#A5A5A5"
          animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 117200">
        </a-sphere>
      </a-entity>

      <!-- Venus: no moons -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 6200">
        <a-sphere position="4.3 0 0" radius="0.15" color="#E8CDA2"
          animation="property: rotation; to: 0 360 0; easing: linear; loop: true; dur: 486000">
        </a-sphere>
      </a-entity>

      <!-- Earth: 1 moon -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 10000">
        <a-entity position="5.6 0 0">
          <a-sphere radius="0.16" color="#2A6EBB"
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2000">
          </a-sphere>

          <!-- Moon -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2500">
            <a-sphere position="0.35 0 0" radius="0.043" color="#AAAAAA"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Mars: 2 moons (Phobos, Deimos) -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 18800">
        <a-entity position="7 0 0">
          <a-sphere id="mars" radius="0.12"
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2060">
          </a-sphere>

          <!-- Phobos -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1200">
            <a-sphere position="0.22 0 0" radius="0.02" color="#8A8A8A"></a-sphere>
          </a-entity>

          <!-- Deimos -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2000">
            <a-sphere position="0.32 0 0" radius="0.015" color="#9A9A9A"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Jupiter: 4 major moons -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 119000">
        <a-entity position="10.5 0 0">
          <a-sphere radius="0.5" color="#D8A76A"
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 820">
          </a-sphere>

          <!-- Io -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1000">
            <a-sphere position="0.75 0 0" radius="0.045" color="#E8D877"></a-sphere>
          </a-entity>

          <!-- Europa -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1500">
            <a-sphere position="0.9 0 0" radius="0.04" color="#D9C9A8"></a-sphere>
          </a-entity>

          <!-- Ganymede -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2200">
            <a-sphere position="1.1 0 0" radius="0.06" color="#A69581"></a-sphere>
          </a-entity>

          <!-- Callisto -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 3000">
            <a-sphere position="1.3 0 0" radius="0.055" color="#6E6559"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Saturn: Titan + rings -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 295000">
        <a-entity position="13.5 0 0"
          animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 900">
          <a-sphere radius="0.45" color="#E5D3A6"></a-sphere>
          <a-torus radius="0.75" radius-tubular="0.03" rotation="75 0 0" color="#8B6F47"></a-torus>

          <!-- Titan -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2600">
            <a-sphere position="1.1 0 0" radius="0.05" color="#C9A66B"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Uranus: Titania, Oberon -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 840000">
        <a-entity position="16.5 0 0">
          <a-sphere radius="0.3" color="#AFDDE5"
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1440">
          </a-sphere>

          <!-- Titania -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1800">
            <a-sphere position="0.5 0 0" radius="0.035" color="#B5ADA3"></a-sphere>
          </a-entity>

          <!-- Oberon -->
          <a-entity
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 2400">
            <a-sphere position="0.65 0 0" radius="0.033" color="#9E968C"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Neptune: Triton (retrograde) -->
      <a-entity position="0 2 -5" rotation="0 0 0"
        animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1650000">
        <a-entity position="19.5 0 0">
          <a-sphere radius="0.29" color="#3B5BA9"
            animation="property: rotation; to: 0 -360 0; easing: linear; loop: true; dur: 1340">
          </a-sphere>

          <!-- Triton -->
          <a-entity
            animation="property: rotation; to: 0 360 0; easing: linear; loop: true; dur: 2100">
            <a-sphere position="0.5 0 0" radius="0.045" color="#C7D3D9"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
